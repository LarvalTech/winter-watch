name: Refresh forecast
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC
    - cron: "30 14 * * *"  # 14:30 UTC, second run in case the first is late
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - name: Run forecast
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: PYTHONPATH=. python scripts/run_forecast.py
      - name: Commit result
        run: |
          git config user.name "winter-watch-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || (git commit -m "Forecast $(date -u +%FT%TZ)" && git push)
